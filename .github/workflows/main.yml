name: Update AI Domains List

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (06:00 МСК)
    - cron: '0 3 * * *'
  workflow_dispatch: # Позволяет запускать вручную для теста

# Даем GITHUB_TOKEN права на запись, чтобы можно было коммитить изменения
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./update-list.sh

      - name: Run update script
        run: ./update-list.sh

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update AI domains list"
          file_pattern: ai_domains.lst
